name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish the APKs as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine + app)
        run: ./gradlew test --console=plain

      - name: Build APKs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            export ANDROID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            export ANDROID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          fi
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: StocksDetective-android
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/StocksDetective-${{ github.run_number }}-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/StocksDetective-${{ github.run_number }}-release$( [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || echo "-unsigned").apk

      # Every push (not pull requests) becomes a downloadable pre-release with the APKs attached.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Android build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          files: dist/*.apk
          body: |
            Stocks Detective for Android, built from ${{ github.sha }}.

            **Install:** download `StocksDetective-${{ github.run_number }}-debug.apk` on your phone and open it
            (allow "Install unknown apps" for your browser when asked). The `-unsigned` release APK must be
            signed before it can be installed.

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
